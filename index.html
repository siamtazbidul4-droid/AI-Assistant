<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <meta name="description" content="Ultra-premium AI chatbot with bilingual Bengali & English support, real-time voice interaction, multi-modal file analysis, and persistent chat history." />
    <meta property="og:title" content="AI Assistant" />
    <meta property="og:description" content="Ultra-premium AI chatbot with bilingual Bengali & English support, real-time voice interaction, multi-modal file analysis, and persistent chat history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/images/ai.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ai_assistant_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
